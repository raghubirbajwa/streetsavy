<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your StreetSavy verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#111111;color:#111111;">
    <!-- Paste this HTML into Supabase → Authentication → Email Templates → Magic Link.
         Keep {{ .Token }} exactly. Replace the image host if APP_URL is not https://www.streetsavy.com. -->
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#111111;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#f4efe6;border:1px solid #111111;">
            <tr>
              <td style="padding:20px 24px 12px;font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#111111;">
                StreetSavy
              </td>
            </tr>
            <tr>
              <td style="padding:0;">
                <img src="https://www.streetsavy.com/email/P_Co-SS26-4.jpg" width="560" alt="StreetSavy SS26" style="display:block;width:100%;max-width:560px;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px;font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#111111;">
                Your verification code
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 8px;font-family:Georgia,'Times New Roman',serif;font-size:36px;letter-spacing:.28em;font-weight:700;color:#111111;">
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 28px;font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.5;color:#111111;">
                Enter this 6-digit code on the StreetSavy account or track-order page. It expires shortly. If you did not request it, you can ignore this email.
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5c5954;">
                Code: {{ .Token }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
